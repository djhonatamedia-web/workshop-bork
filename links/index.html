<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Avatar */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #f3f4f6;
      border: 3px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }

    .bio {
      font-size: .85rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
      color: #111827;
      font-size: .95rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .18s, box-shadow .18s, transform .1s;
    }

    .link-btn:hover {
      border-color: #22c55e;
      box-shadow: 0 4px 20px rgba(34,197,94,.12);
    }

    .link-btn:active { transform: scale(.98); }

    .link-btn.featured {
      background: #22c55e;
      border-color: #22c55e;
      color: #fff;
      box-shadow: 0 4px 20px rgba(34,197,94,.3);
    }

    .link-btn.featured:hover {
      background: #16a34a;
      border-color: #16a34a;
      box-shadow: 0 6px 24px rgba(34,197,94,.4);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-btn.featured .link-icon {
      background: rgba(255,255,255,.2);
    }

    .link-label { flex: 1; }

    .link-arrow {
      opacity: .4;
      flex-shrink: 0;
    }

    .link-btn.featured .link-arrow { opacity: .7; }

    /* Footer */
    .footer {
      margin-top: 40px;
      font-size: .72rem;
      color: #d1d5db;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- PERFIL -->
  <div class="avatar">
    <!-- <img src="foto.jpg" alt="Foto"> -->
    🎯
  </div>
  <p class="name">Seu Nome</p>
  <p class="bio">Gestor de Tráfego · Ajudo negócios a escalar com Meta Ads e Google Ads</p>

  <!-- LINKS -->
  <div class="links">

    <!-- Destaque -->
    <a href="#" class="link-btn featured">
      <div class="link-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <span class="link-label">Curso de Tráfego</span>
      <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="link-btn">
      <div class="link-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <span class="link-label">Aumente suas Vendas</span>
      <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="link-btn">
      <div class="link-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e1306c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#e1306c" stroke="none"/></svg>
      </div>
      <span class="link-label">Instagram</span>
      <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="link-btn">
      <div class="link-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff0000"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
      </div>
      <span class="link-label">YouTube</span>
      <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="link-btn">
      <div class="link-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#010101"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.74a4.85 4.85 0 01-1.01-.05z"/></svg>
      </div>
      <span class="link-label">TikTok</span>
      <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

  </div>

  <p class="footer">© 2026 · Seu Nome</p>
</div>

</body>
</html>
