<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Djhonata · Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Gradiente de fundo sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(34,197,94,.07), transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(34,197,94,.05), transparent 60%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Avatar */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2.5px solid #22c55e;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 0 0 4px rgba(34,197,94,.12), 0 8px 32px rgba(0,0,0,.4);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

    .name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }

    .handle {
      font-size: .82rem;
      color: #22c55e;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .bio {
      font-size: .82rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.65;
      max-width: 300px;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #1f1f1f;
      border-radius: 14px;
      background: #111111;
      color: #e5e7eb;
      font-size: .9rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .1s;
    }

    .link-btn:hover {
      border-color: #22c55e;
      background: #141414;
      color: #fff;
    }

    .link-btn:active { transform: scale(.98); }

    .link-btn.featured {
      background: #22c55e;
      border-color: #22c55e;
      color: #000;
      font-weight: 700;
      box-shadow: 0 4px 24px rgba(34,197,94,.25);
    }

    .link-btn.featured:hover {
      background: #16a34a;
      border-color: #16a34a;
    }

    .link-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-btn.featured .link-icon {
      background: rgba(0,0,0,.15);
    }

    .link-label { flex: 1; }

    .link-arrow { opacity: .35; flex-shrink: 0; }
    .link-btn.featured .link-arrow { opacity: .6; }
    .link-btn:hover .link-arrow { opacity: .7; }

    /* Footer */
    .footer {
      margin-top: 36px;
      font-size: .7rem;
      color: #2d2d2d;
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
