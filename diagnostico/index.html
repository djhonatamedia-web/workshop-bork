    /* ─── Tokens ──────────────────────────────────────── */
    :root {
      --g:     #22c55e;
      --g-mid: #4ade80;
      --g-pale:#86efac;
      --g-glow:rgba(34,197,94,.18);
      --g-sm:  rgba(34,197,94,.09);
      --amber: #f59e0b;
      --bg:    #06060a;
      --s1:    #0c0c12;
      --s2:    #121219;
      --s3:    #17171f;
      --bd:    rgba(255,255,255,.06);
      --bd-h:  rgba(34,197,94,.4);
      --tx:    #f0f0f5;
      --tx2:   #9898b0;
      --tx3:   #4b4b62;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100dvh;

      align-items: center;
      justify-content: center;
      padding: 32px 20px 64px;
      overflow-x: hidden;
      position: relative;
    }

    /* ─── Atmosphere ──────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 10% 0%,   rgba(34,197,94,.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%,  rgba(34,197,94,.05) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%,   rgba(34,197,94,.02) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* subtle grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Shell ───────────────────────────────────────── */
    .shell {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    /* ─── Top chrome ──────────────────────────────────── */
    .chrome {
      display: none;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .chrome.show { display: flex; }

    .back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px; height: 34px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--s1);
      color: var(--tx3);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color .18s, color .18s, background .18s;
    }
    .back-btn:hover { border-color: var(--bd-h); color: var(--tx); background: var(--s2); }
    .back-btn.show { display: flex; }

    .prog-wrap { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .prog-label {
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--tx3);
      transition: color .3s;
    }
    .prog-label.done { color: var(--g); }
    .prog-track {
      height: 2px;
      background: var(--s3);
      border-radius: 2px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--g), var(--g-mid));
      border-radius: 2px;
      transition: width .45s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 10px rgba(34,197,94,.5);
    }

    /* ─── Animations ──────────────────────────────────── */
    @keyframes fwd  { from{opacity:0;transform:translateX(22px)} to{opacity:1;transform:translateX(0)} }
    @keyframes back { from{opacity:0;transform:translateX(-22px)} to{opacity:1;transform:translateX(0)} }
    @keyframes rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
    @keyframes glow { 0%,100%{box-shadow:0 0 20px var(--g-glow)} 50%{box-shadow:0 0 40px rgba(34,197,94,.3)} }

    .anim-fwd  { animation: fwd  .28s cubic-bezier(.4,0,.2,1) both; }
    .anim-back { animation: back .28s cubic-bezier(.4,0,.2,1) both; }
    .anim-rise { animation: rise .32s cubic-bezier(.4,0,.2,1) both; }

      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--g);
      margin-bottom: 14px;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--g);
      box-shadow: 0 0 5px var(--g);
      animation: pulse 2.2s ease infinite;
    }

    /* ─── Typography ──────────────────────────────────── */
    .headline {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.22;
      color: var(--tx);
      margin-bottom: 10px;
    }
    .sub {
      font-size: .88rem;
      color: var(--tx2);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .grad {
      background: linear-gradient(125deg, #22c55e 0%, #86efac 55%, #4ade80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── Options ─────────────────────────────────────── */
    .opts { display: flex; flex-direction: column; gap: 9px; }

    .opt {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 16px;
      border: 1px solid var(--bd);
      border-radius: 14px;
      background: var(--s1);
      color: var(--tx2);
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color .18s, background .18s, color .18s, box-shadow .18s, transform .12s;
      position: relative;
      overflow: hidden;
    }
    .opt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(34,197,94,.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .18s;
    }
    .opt:hover { border-color: var(--bd-h); background: var(--s2); color: var(--tx); box-shadow: 0 0 0 3px var(--g-sm); }
    .opt:hover::before { opacity: 1; }
    .opt:active { transform: scale(.983); }

    .opt-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.03);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .03em;
      color: var(--tx3);
      transition: background .18s, border-color .18s, color .18s;
    }
    .opt:hover .opt-letter {
      background: rgba(34,197,94,.14);
      border-color: rgba(34,197,94,.35);
      color: var(--g);
    }
    .opt-text { font-size: .88rem; font-weight: 500; line-height: 1.45; }

    /* ─── Buttons ─────────────────────────────────────── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 17px 20px;
      border: 1px solid var(--bd);
      border-radius: 14px;
      background: var(--s1);
      color: var(--tx2);
      font-size: .92rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .18s, background .18s, color .18s, box-shadow .18s, transform .12s;
      text-align: center;
    }
    .btn:hover { border-color: var(--bd-h); background: var(--s2); color: var(--tx); }
    .btn:active { transform: scale(.98); }

    .btn-primary {
      background: var(--g);
      border-color: var(--g);
      color: #000;
      font-weight: 700;
      font-size: .95rem;
      box-shadow: 0 4px 28px rgba(34,197,94,.28);
      animation: glow 3s ease infinite;
    }
    .btn-primary:hover { background: var(--g-mid); border-color: var(--g-mid); box-shadow: 0 6px 36px rgba(34,197,94,.4); color: #000; }

    /* ─── Form ────────────────────────────────────────── */
    .form { display: flex; flex-direction: column; gap: 10px; }
    .field {
      position: relative;
    }
    .field-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: .95rem;
      pointer-events: none;
      line-height: 1;
    }
    .field input {
      width: 100%;
      padding: 15px 16px 15px 48px;
      border: 1px solid var(--bd);
      border-radius: 13px;
      background: var(--s1);
      color: var(--tx);
      font-size: .9rem;
      font-family: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    .field input::placeholder { color: var(--tx3); }
    .field input:focus { outline: none; border-color: rgba(34,197,94,.45); box-shadow: 0 0 0 3px var(--g-sm); }
    .form .btn { margin-top: 4px; border: none; }

    /* ─── Intro screen ────────────────────────────────── */
    .intro-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid rgba(34,197,94,.22);
      border-radius: 999px;
      background: rgba(34,197,94,.05);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--g);
      margin-bottom: 22px;
    }

    .intro-hl {
      font-size: clamp(1.75rem, 5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -.05em;
      line-height: 1.14;
      color: var(--tx);
      margin-bottom: 18px;
    }

    .intro-body {
      font-size: .9rem;
      color: var(--tx2);
      line-height: 1.72;
      margin-bottom: 26px;
    }

    .checks {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 32px;
    }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: .86rem;
      color: var(--tx2);
      line-height: 1.55;
    }
    .check-icon {
      width: 22px; height: 22px;
      border-radius: 7px;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      color: var(--g);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .intro-footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: .71rem;
      color: var(--tx3);
    }
    .sep { color: var(--s3); }

    /* ─── Processing ──────────────────────────────────── */
    .proc {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 0 40px;
      gap: 22px;
    }
    .proc-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid var(--s3);
      border-top-color: var(--g);
      animation: spin .85s linear infinite;
      box-shadow: 0 0 20px var(--g-glow);
    }
    .proc-text {
      font-size: .95rem;
      font-weight: 600;
      color: var(--tx2);
      letter-spacing: -.01em;
    }
    .proc-sub {
      font-size: .76rem;
      color: var(--tx3);
      letter-spacing: .01em;
    }

    /* ─── Result ──────────────────────────────────────── */
    .res-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 999px;
      background: rgba(34,197,94,.05);
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--g);
      margin-bottom: 22px;
    }

    .res-icon-wrap {
      width: 70px; height: 70px;
      border-radius: 20px;
      background: var(--s1);
      border: 1px solid rgba(255,255,255,.07);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 0 0 1px rgba(34,197,94,.12), 0 0 50px var(--g-glow);
      animation: glow 3.5s ease infinite;
    }
    .res-icon-wrap::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(34,197,94,.25) 0%, transparent 55%);
      z-index: -1;
    }

    .res-hl {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .res-body {
      font-size: .87rem;
      color: var(--tx2);
      line-height: 1.78;
      margin-bottom: 22px;
    }

    .cons-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }

    .con {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 14px;
      border: 1px solid rgba(245,158,11,.1);
      border-radius: 12px;
      background: rgba(245,158,11,.04);
      font-size: .82rem;
      color: var(--tx2);
      line-height: 1.55;
    }
    .con-icon { color: var(--amber); flex-shrink: 0; font-size: .8rem; margin-top: 2px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--s3); }
    .div-label {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--tx3);
      white-space: nowrap;
    }

    .cta-note {
      font-size: .83rem;
      color: var(--tx2);
      line-height: 1.68;
      margin-bottom: 14px;
    }

    /* ─── Footer ──────────────────────────────────────── */
    .footer {
      margin-top: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .footer-mark {
      width: 22px; height: 22px;
      border-radius: 7px;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      font-weight: 900;
      color: var(--g);
    }
    .footer-text { font-size: .69rem; color: var(--tx3); letter-spacing: .02em; }
  </style>
</head>

          'Agora multiplica por todos os cliques que você pagou nesse período. Esse é o dinheiro que evaporou — não por causa do anúncio, não por causa do produto, mas pelo que acontece depois do clique. ' +
          'O criativo faz a pessoa parar. O destino faz ela comprar. Você tem um, mas não o outro. ' +
          'E enquanto você continua mandando tráfego para o lugar errado, cada real investido confirma que não funciona — sem que você saiba exatamente por quê.'
        );
      },
      cons: [
        'Cada real em tráfego pagou por uma visita que saiu sem converter — e você não vai recuperar esse dinheiro',
        'Leads que chegam sem contexto e saem sem interagir não voltam: você comprou e descartou sem saber',
        'Aumentar o orçamento agora vai ampliar o desperdício, não as vendas',
      ],
    },

    PUBLICO: {
      icon: '🎯',
      title: 'Você está pagando para falar com quem não vai comprar',
      body: function (ans) {
        var q3 = ans.q3 ? ans.q3.idx : null;
        var segDesc = q3 === 0
          ? 'colocando alguns interesses e deixando o algoritmo decidir'
          : q3 === 1
          ? 'usando as sugestões automáticas da plataforma'
          : q3 === 3
          ? 'sem saber exatamente quem está vendo seus anúncios'
          : 'sem uma definição precisa de quem é seu comprador real';
        return (
          'Você está ' + segDesc + '. O que o algoritmo faz com isso? Encontra quem tem mais chance de <strong>clicar</strong> — não de <strong>comprar.</strong> São pessoas completamente diferentes. ' +
          'O resultado é um custo por lead que parece razoável, mas gera contatos que somem, não respondem, ou respondem mas nunca fecham. ' +
          'Enquanto isso, os seus compradores reais — que têm o problema, têm a verba e estão procurando solução agora — estão vendo o anúncio do seu concorrente. Não o seu. ' +
          '<strong>O dinheiro que você investiu não comprou clientes. Comprou curiosos.</strong> ' +
          'E o pior: quanto mais você escala esse orçamento sem corrigir o público, mais você financia interações sem intenção de compra. A escala amplifica o erro — não as vendas.'
        );
      },
      cons: [
        'Cada real investido num público errado é um real que nunca chegou ao seu comprador real',
        'Enquanto você financia curiosos, seu concorrente aparece para quem realmente vai comprar',
        'Escalar orçamento sem corrigir o público multiplica o problema — não resolve',
      ],
    },

    CRIATIVO: {
      icon: '📺',
      title: 'Seus anúncios não param o scroll — e o algoritmo te pune por isso',
      body: function (ans) {
        var q4 = ans.q4 ? ans.q4.idx : null;
        var criativoDesc = q4 === 0
          ? 'você mostrou o produto, falou sobre o que ele faz, destacou os diferenciais'
          : q4 === 1
          ? 'você priorizou um visual bonito, profissional, bem produzido'
          : q4 === 3
          ? 'você adaptou o que os concorrentes estão fazendo e aplicou no seu negócio'
          : 'você criou um anúncio sem o gatilho certo de identificação';
        return (
          'Quando ' + criativoDesc + ', o resultado é sempre o mesmo: <strong>a pessoa passa reto.</strong> ' +
          'No feed de hoje, o usuário médio é exposto a centenas de anúncios por dia e desenvolveu o reflexo de ignorar tudo que não gritar <em>"isso está falando sobre o que eu vivo"</em> nos primeiros dois segundos. ' +
          'Anúncio que fala do produto, do serviço, do que a empresa oferece não ativa esse gatilho. Nunca ativou. ' +
          'O resultado concreto: CTR baixo → algoritmo interpreta que seu anúncio não é relevante → distribui menos → você paga mais por resultado pior. ' +
          '<strong>É um ciclo que se autoalimenta.</strong> E enquanto seu anúncio não para o scroll, seu concorrente que entendeu isso está capturando, a um custo menor, a atenção que seria sua — todos os dias.'
        );
      },
      cons: [
        'CTR baixo → algoritmo pune → você paga mais para aparecer menos para as pessoas erradas',
        'Cada criativo trocado sem direção começa do zero — sem acúmulo de aprendizado',
        'Concorrentes com copy de dor estão convertendo seu público enquanto você testa no escuro',
      ],
    },

    METRICAS: {
      icon: '🌫️',
      title: 'Você está tomando decisões de dinheiro no escuro',
      body: function (ans) {
        var q5 = ans.q5 ? ans.q5.idx : null;
        var q1 = ans.q1 ? ans.q1.idx : null;
        var metrica = q5 === 0
          ? 'Você olha para curtidas, alcance e visualizações para saber se o mês foi bom. Essas métricas medem popularidade — não resultado. <strong>Curtidas não pagam conta. Alcance não é venda.</strong>'
          : q5 === 1
          ? 'Você espera ver se as vendas subiram no geral — mas sem isolar o que mudou, você nunca consegue identificar o que causou o resultado, bom ou ruim.'
          : q5 === 3
          ? 'Você não acompanha as métricas porque é complicado demais. O problema: o dinheiro continua saindo, e sem dados você não tem como saber se está indo para o lugar certo ou direto pelo ralo.'
          : 'Você não tem visibilidade real sobre o que está funcionando e o que não está.';
        var ciclo = q1 === 0
          ? ' <strong>Todo mês você reinveste. Todo mês o ciclo se repete:</strong> gasta, não sabe o que funcionou, muda algo sem saber se estava certo, repete. Sem dados reais, cada real investido é um chute com dinheiro de verdade.'
          : q1 === 1
          ? ' Você investiu, não viu retorno claro, e parou. Faz sentido — porque sem dados, continuar seria jogar dinheiro fora às cegas. Mas o problema é que você também ficou sem o aprendizado que só os dados dariam.'
          : '';
        return (
          metrica +
          ' Você provavelmente já pausou campanhas que estavam começando a funcionar — porque sem dados pareciam que não iam. E manteve campanhas ativas que drenavam orçamento silenciosamente — porque o alcance parecia bom.' +
          ciclo +
          ' <strong>O próximo mês vai ser igual ao último — a não ser que isso mude.</strong>'
        );
      },
      cons: [
        'Sem custo por lead e custo por venda, é impossível saber o que funciona e o que drena',
        'Você provavelmente já pausou o que estava funcionando e manteve o que estava queimando verba',
        'Cada mês sem dados é um mês onde o mesmo erro se repete e você paga por ele de novo',
      ],
    },

    BASE: {
      icon: '🏗️',
      title: 'Você quer crescer, mas a fundação não está no lugar',
      body: function (ans) {
        var q1 = ans.q1 ? ans.q1.idx : null;
        var contexto = q1 === 1
          ? 'Você já foi por esse caminho: investiu em anúncios, o dinheiro saiu, o resultado não veio, e você parou. Não foi fraqueza — foi o resultado certo para uma fundação errada. <strong>Sem pixel, sem funil, sem oferta clara, o algoritmo não tinha o que otimizar.</strong> Você pagou para confirmar que não funcionava.'
          : 'Você ainda não colocou dinheiro em tráfego pago — e isso, agora, é uma vantagem real. <strong>Você ainda não pagou para confirmar que a base estava errada.</strong> Quem entra sem estrutura aprende o que não funciona a um custo muito alto.';
        return (
          contexto +
          ' A ordem de construção é inegociável: pixel instalado → oferta clara → página que converte → depois tráfego. ' +
          'Inverter isso não quebra só o retorno — quebra o aprendizado. Sem conversão, o algoritmo não tem dados. Sem dados, ele não encontra seu comprador. ' +
          '<strong>Você termina pagando o CPM mais caro do mercado por resultados que não chegam</strong> — e sem entender por quê, o ciclo se repete mês a mês até o orçamento acabar.'
        );
      },
      cons: [
        'Sem pixel configurado, o algoritmo otimiza no escuro — e cobra o preço mais alto por isso',
        'Sem uma página que converte, nenhum orçamento gera retorno real — independente do quanto você invista',
        'Entrar em tráfego sem fundação é pagar para aprender o que não funciona, um erro caro de cada vez',
      ],
    },
  };

  /* ── State ─────────────────────────────────────────── */
  var state = { step: S.INTRO, answers: {}, dx: null, name: '', submitted: false };
  var stack = [];
  var dir   = 'fwd';

  /* ── DOM refs ──────────────────────────────────────── */
  var root      = document.getElementById('root');
  var chrome    = document.getElementById('chrome');
  var backBtn   = document.getElementById('back-btn');
  var progFill  = document.getElementById('prog-fill');
  var progLabel = document.getElementById('prog-label');

  /* ── Helpers ───────────────────────────────────────── */
  function genId() {
    return (crypto.randomUUID && crypto.randomUUID()) ||
           (Date.now() + '-' + Math.random().toString(36).slice(2));
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function setHtml(html) {
    root.innerHTML = html;
    var el = root.firstElementChild;
    if (el) el.classList.add(dir === 'fwd' ? 'anim-fwd' : 'anim-back');
  }

  function dx() {
    var score = {METRICAS:0, FUNIL:0, PUBLICO:0, CRIATIVO:0, BASE:0};
    QS.forEach(function(q) {
      var a = state.answers[q.id];
      if (a && a.cat) score[a.cat]++;
    });
    var max = -1, res = 'METRICAS';
    PRIORITY.forEach(function(k) { if (score[k] > max) { max = score[k]; res = k; } });
    return res;
  }

  /* ── Chrome update ─────────────────────────────────── */
  function updateChrome() {
    var onIntro  = state.step === S.INTRO;
    var onResult = state.step === S.RESULT || state.step === S.PROCESSING;
    var onCapt   = state.step === QS.length;
    var qIdx     = state.step; // 0-5 for questions

    chrome.classList.toggle('show', !onIntro);
    backBtn.classList.toggle('show', stack.length > 0 && !onResult && !onCapt);

    if (onIntro) return;

    if (onResult) {
      progFill.style.width = '100%';
      progLabel.textContent = 'Diagnóstico concluído';
      progLabel.classList.add('done');
      return;
    }

    progLabel.classList.remove('done');

    if (state.step === S.PROCESSING) {
      progFill.style.width = '100%';
      progLabel.textContent = 'Analisando...';
      return;
    }

    if (onCapt) {
      progFill.style.width = '92%';
      progLabel.textContent = 'Quase lá...';
      return;
    }

    var pct = (qIdx / QS.length) * 100;
    progFill.style.width = pct + '%';
    progLabel.textContent = 'Pergunta ' + (qIdx + 1) + ' de ' + QS.length;
  }

  /* ── Render dispatcher ─────────────────────────────── */
  function render() {
    updateChrome();
    if      (state.step === S.INTRO)      renderIntro();
    else if (state.step < QS.length)      renderQ(QS[state.step]);
    else if (state.step === QS.length)    renderCapture();
    else if (state.step === S.PROCESSING) renderProcessing();
    else                                   renderResult();
  }

  /* ── Intro ─────────────────────────────────────────── */
  function renderIntro() {
    setHtml(
      '<div>' +
      '<div class="intro-pill"><span class="dot"></span> Diagnóstico gratuito</div>' +
      '<h1 class="intro-hl">O que está <span class="grad">freando suas vendas</span> online?</h1>' +
      '<p class="intro-body">Em 6 perguntas rápidas você descobre o principal erro que está custando dinheiro ao seu negócio — e o que fazer para corrigir a partir de hoje.</p>' +
      '<div class="checks">' +
        '<div class="check"><div class="check-icon">✓</div><span>Identifica o gargalo principal das suas vendas</span></div>' +
        '<div class="check"><div class="check-icon">✓</div><span>Explica por que esse erro está custando dinheiro</span></div>' +
        '<div class="check"><div class="check-icon">✓</div><span>Mostra o próximo passo concreto para corrigir</span></div>' +
      '</div>' +
      '<div class="opts">' +
        '<button class="btn btn-primary" id="start-btn">Começar diagnóstico →</button>' +
      '</div>' +
      '<div class="intro-footer">' +
        '<span>Gratuito</span><span class="sep">·</span><span>60 segundos</span><span class="sep">·</span><span>Resultado personalizado</span>' +
      '</div>' +
      '</div>'
    );
    document.getElementById('start-btn').addEventListener('click', function () {
      try { trackVC(); } catch (_) {}
      fwd();
    });
  }

  /* ── Question ──────────────────────────────────────── */
  function renderQ(q) {
    var opts = q.options.map(function (o, i) {
      return (
        '<button class="opt">' +
        '<span class="opt-letter">' + LETTERS[i] + '</span>' +
        '<span class="opt-text">' + esc(o.t) + '</span>' +
        '</button>'
      );
    }).join('');

    setHtml(
      '<div>' +
      '<div class="eyebrow"><span class="dot"></span>' + esc(q.eyebrow) + '</div>' +
      '<h2 class="headline">' + esc(q.title) + '</h2>' +
      '<div class="opts">' + opts + '</div>' +
      '</div>'
    );

    root.querySelectorAll('.opt').forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        stack.push({ step: state.step, answers: JSON.parse(JSON.stringify(state.answers)) });
        state.answers[q.id] = { t: q.options[i].t, cat: q.options[i].cat, idx: i };
        fwd();
      });
    });
  }

  /* ── Capture ───────────────────────────────────────── */
  function renderCapture() {
    state.dx = dx();
    setHtml(
      '<div>' +
      '<div class="eyebrow"><span class="dot"></span>Último passo</div>' +
      '<h2 class="headline">Seu diagnóstico está pronto</h2>' +
      '<p class="sub">Deixe seu contato para revelar o resultado — e receber o caminho certo para o seu caso específico.</p>' +
      '<form class="form" id="form">' +
        '<div class="field"><span class="field-icon">👤</span><input id="fname" type="text"  placeholder="Seu nome"         autocomplete="name" required /></div>' +
        '<div class="field"><span class="field-icon">📱</span><input id="fphone" type="tel" placeholder="WhatsApp com DDD"  autocomplete="tel"  required /></div>' +
        '<button type="submit" class="btn btn-primary">Revelar meu diagnóstico →</button>' +
      '</form>' +
      '</div>'
    );
    document.getElementById('form').addEventListener('submit', onSubmit);
  }

  function onSubmit(e) {
    e.preventDefault();
    var name  = document.getElementById('fname').value.trim();
    var phone = document.getElementById('fphone').value.trim();
    if (!name || !phone) return;
    state.name = name;
    if (!state.submitted) {
      state.submitted = true;
      persist(name, phone);
      trackLead(name, phone);
    }
    dir = 'fwd';
    state.step = S.PROCESSING;
    render();
  }

  /* ── Processing ────────────────────────────────────── */
  function renderProcessing() {
    setHtml(
      '<div>' +
      '<div class="proc">' +
        '<div class="proc-ring"></div>' +
        '<div class="proc-text">Analisando suas respostas...</div>' +
        '<div class="proc-sub">Calculando seu diagnóstico</div>' +
      '</div>' +
      '</div>'
    );
    setTimeout(function () {
      dir = 'fwd';
      state.step = S.RESULT;
      render();
    }, 1700);
  }

  /* ── Result ────────────────────────────────────────── */
  function renderResult() {
    var d = DX[state.dx];
    var first = esc(state.name.split(' ')[0]);
    var q1 = state.answers.q1;
    var pro = q1 && (q1.idx === 0 || q1.idx === 1);
    var waMsg = encodeURIComponent('Olá Djhonata! Fiz o diagnóstico de vendas e meu resultado foi: ' + d.title + '. Quero saber mais.');
    var waUrl = 'https://wa.me/' + WA + '?text=' + waMsg;

    var cta = pro
      ? '<p class="cta-note">A cada semana que passa com essa estrutura quebrada, você está pagando para confirmar que não funciona. O dinheiro sai, o ciclo se repete, e a diferença entre o mês que passou e o próximo mês é zero — a não ser que algo mude agora.</p>' +
        '<a href="' + waUrl + '" target="_blank" rel="noopener" class="btn btn-primary">Quero resolver isso com um especialista →</a>' +
        '<a href="/vendas" class="btn">Prefiro aprender a corrigir sozinho</a>'
      : '<p class="cta-note">Você tem uma janela que a maioria perde: aprender a estrutura certa antes de colocar dinheiro em tráfego. Quem aprende depois — depois de queimar verba, de parar campanhas no escuro, de meses sem retorno — paga um preço muito mais alto pelo mesmo aprendizado.</p>' +
        '<a href="/vendas" class="btn btn-primary">Quero aprender antes de jogar dinheiro fora →</a>' +
        '<a href="' + waUrl + '" target="_blank" rel="noopener" class="btn">Prefiro contratar um especialista</a>';

    var cons = d.cons.map(function (c) {
      return '<div class="con"><span class="con-icon">⚠</span><span>' + esc(c) + '</span></div>';
    }).join('');

    setHtml(
      '<div>' +
      '<div class="res-pill"><span class="dot"></span>Seu diagnóstico, ' + first + '</div>' +
      '<div class="res-icon-wrap">' + d.icon + '</div>' +
      '<h2 class="res-hl grad">' + esc(d.title) + '</h2>' +
      '<p class="res-body">' + d.body(state.answers) + '</p>' +
      '<div class="cons-list">' + cons + '</div>' +
      '<div class="divider"><span class="div-label">O que fazer agora</span></div>' +
      '<div class="opts">' + cta + '</div>' +
      '</div>'
    );
  }

  /* ── Navigation ────────────────────────────────────── */
  function fwd() { dir = 'fwd'; state.step++; render(); }

  backBtn.addEventListener('click', function () {
    if (!stack.length || state.step >= S.PROCESSING) return;
    var prev = stack.pop();
    dir = 'back';
    state.step = prev.step;
    state.answers = prev.answers;
    render();
  });

  /* ── Backend ───────────────────────────────────────── */
  function persist(name, phone) {
    var ans = {};
    QS.forEach(function (q) { if (state.answers[q.id]) ans[q.id] = state.answers[q.id].t; });
    fetch('/quiz-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({ path: 'diagnostico', diagnosis: state.dx, name: name, phone: phone, answers: ans }),
    }).catch(function () {});
  }

  /* ── Pixel ─────────────────────────────────────────── */
  function trackVC() {
    var id = genId();
    try { fbq('track', 'ViewContent', { content_name: 'diagnostico' }, { eventID: id }); } catch (_) {}
    fetch('/tracker', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event_name: 'ViewContent', event_id: id, event_time: Math.floor(Date.now() / 1000), event_source_url: window.location.href, user_data: {} }),
    }).catch(function () {});
  }

  function trackLead(name, phone) {
    var id = genId();
    try { fbq('track', 'Lead', {}, { eventID: id }); } catch (_) {}
    fetch('/tracker', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ event_name: 'Lead', event_id: id, event_time: Math.floor(Date.now() / 1000), event_source_url: window.location.href, user_data: { fn: name, ph: phone } }),
    }).catch(function () {});
  }

  /* ── Boot ──────────────────────────────────────────── */
  render();
})();
</script>

</body>
</html>
